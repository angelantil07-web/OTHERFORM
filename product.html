
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODUCT — OTHERFORM</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">OTHERFORM</a>

            <div class="nav-links">
                <a href="shop.html">SHOP</a>
                <a href="index.html#about">ABOUT</a>
                <a href="cart.html">CART (0)</a>
            </div>
        </nav>
    </header>

    <main class="product-page">

        <a href="shop.html" class="back-link">← BACK TO SHOP</a>

        <section class="product-detail">

            <div class="product-detail-image">
                <img id="product-image"
                     src="assets/images/sunglasses.jpg"
                     alt="OTHERFORM product">
            </div>

            <div class="product-detail-info">

                <p class="section-label" id="product-category">
                    OTHERFORM — EYEWEAR

                <h1 id="product-name">ARC SUNGLASSES</h1>

                <p class="detail-price" id="product-price">₹1,899</p>

                <div class="product-divider"></div>

                <p class="product-description" id="product-description">
                    A considered silhouette designed for everyday wear.
                    Minimal in form, distinctive in presence.
                </p>

                <p class="product-reference" id="product-reference">
                    REF. 001 / COLLECTION 001
                </p>

                <button class="add-to-cart" id="add-to-cart">
                         ADD TO CART
                </button>

                <p class="shipping-note">
                    Complimentary shipping on all orders.
                </p>

            </div>

        </section>

    </main>

    <footer>
        <p>OTHERFORM © 2026</p>
        <p>OBJECTS, RECONSIDERED.</p>
    </footer>

<script>

const products = {

    arc: {
        name: "ARC SUNGLASSES",
        price: "₹1,899",
        category: "EYEWEAR",
        image: "assets/images/sunglasses.jpg",
        reference: "REF. 001 / COLLECTION 001",
        description: "A considered silhouette designed for everyday wear. Minimal in form, distinctive in presence."
    },

    form: {
        name: "FORM SHOULDER BAG",
        price: "₹3,499",
        category: "BAGS",
        image: "assets/images/shoulder-bag.png",
        reference: "REF. 002 / COLLECTION 001",
        description: "An understated everyday essential. Designed with purpose, defined by simplicity."
    },

    mono: {
        name: "MONO CARDHOLDER",
        price: "₹999",
        category: "OBJECTS",
        image: "assets/images/cardholder.png",
        reference: "REF. 003 / COLLECTION 001",
        description: "A compact everyday object. Functional design meets a refined silhouette."
    },

    frame: {
        name: "FRAME SUNGLASSES",
        price: "PRICE TBD",
        category: "EYEWEAR",
        image: "assets/images/frame.png",
        reference: "REF. 004 / COLLECTION 001",
        description: "A distinctive frame designed to make an understated statement."
    },

    offset: {
        name: "OFFSET SHADES",
        price: "PRICE TBD",
        category: "EYEWEAR",
        image: "assets/images/offset.png",
        reference: "REF. 005 / COLLECTION 001",
        description: "Contemporary eyewear with a considered, unconventional silhouette."
    },

    carry: {
        name: "CARRY TOTE",
        price: "PRICE TBD",
        category: "BAGS",
        image: "assets/images/carry.png",
        reference: "REF. 006 / COLLECTION 001",
        description: "A practical everyday companion. Designed to carry what matters."
    },

    sling: {
        name: "SLING CROSSBODY",
        price: "PRICE TBD",
        category: "BAGS",
        image: "assets/images/sling.png",
        reference: "REF. 007 / COLLECTION 001",
        description: "A versatile carry essential with a clean, functional form."
    },

    edge: {
        name: "EDGE WALLET",
        price: "PRICE TBD",
        category: "OBJECTS",
        image: "assets/images/edge.png",
        reference: "REF. 008 / COLLECTION 001",
        description: "A minimal everyday accessory where function meets form."
    },

    object: {
        name: "OBJECT WATCH",
        price: "PRICE TBD",
        category: "OBJECTS",
        image: "assets/images/object.png",
        reference: "REF. 009 / COLLECTION 001",
        description: "A considered timepiece designed around simplicity and detail."
    }

};

const params = new URLSearchParams(window.location.search);
const selectedItem = params.get("item");

const product = products[selectedItem] || products.arc;

document.getElementById("product-name").textContent = product.name;

document.getElementById("product-price").textContent = product.price;

document.getElementById("product-category").textContent =
    "OTHERFORM — " + product.category;

document.getElementById("product-image").src = product.image;

document.getElementById("product-image").alt = product.name;

document.getElementById("product-reference").textContent =
    product.reference;

document.getElementById("product-description").textContent =
    product.description;

document.title = product.name + " — OTHERFORM";

</script>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const addButton = document.getElementById("add-to-cart");

    if (!addButton) return;

    addButton.addEventListener("click", function () {

        const params = new URLSearchParams(window.location.search);
        const selectedItem = params.get("item") || "arc";

        let cart = JSON.parse(
            localStorage.getItem("otherform-cart") || "[]"
        );

        const existingProduct = cart.find(
            item => item.id === selectedItem
        );

        if (existingProduct) {
            existingProduct.quantity += 1;
        } else {
            cart.push({
                id: selectedItem,
                quantity: 1
            });
        }

        localStorage.setItem(
            "otherform-cart",
            JSON.stringify(cart)
        );

        addButton.textContent = "ADDED TO CART ✓";

        setTimeout(function () {
            addButton.textContent = "ADD TO CART";
        }, 1500);

    });

});
</script>

<script>
function updateCartCount() {

    let cart = JSON.parse(
        localStorage.getItem("otherform-cart") || "[]"
    );

    let totalItems = cart.reduce(function(total, item) {
        return total + item.quantity;
    }, 0);

    let cartLink = document.querySelector('a[href="cart.html"]');

    if (cartLink) {
        cartLink.textContent = "CART (" + totalItems + ")";
    }
}

updateCartCount();
</script>

</body>
</html>
